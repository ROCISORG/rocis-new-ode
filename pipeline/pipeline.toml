# Where the pipeline reads from and writes to. Paths are relative to this folder.
# `registry` and `output` hold private data (site IDs), so they live outside this repository.
[paths]
published_data = "../../rocis.github.io/Data"
site_data = "../data"
output = "../../rocis-outdoor-explorer-private/output"
registry = "../../rocis-outdoor-explorer-private/sites.csv"
neighborhood_directory = "../../rocis.github.io/neighborhood_codes_directory.html"
old_explorer = "../../rocis.github.io/explorer.html"

# Cohorts built from raw monitor downloads instead of a published CSV.
# Readings at or before `start` (and at or after `end`, if set) are left out.
[[raw_cohorts]]
cohort = 70
raw = "../../rocis.github.io/cohort 70 raw outdoor data"
start = "2026-10-01 00:00:00"

# The summary CSV (one row per download, every monitor). `existing` is the folder with the latest
# Small_/Large_round_all_unique_mark_intervention.csv; they are copied, never changed, and new rows are appended.
# The corrections file and the raw folders name site IDs, so they live outside this repository.
[summary]
existing = "../../summary csv p2"
corrections = "../../rocis-outdoor-explorer-private/summary-corrections.csv"

[[summary.cohorts]]
cohort = 68
raw = "../../cohort 68-70 all raw/coh 68 raw dylos data"

[[summary.cohorts]]
cohort = 69
raw = "../../cohort 68-70 all raw/coh 69 raw dylos downloads"

[[summary.cohorts]]
cohort = 70
raw = "../../cohort 68-70 all raw/coh 70 raw dylos data"
